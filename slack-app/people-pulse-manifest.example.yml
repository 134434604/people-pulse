display_information:
  name: People Pulse Read-Only
  description: Approved public-channel task-flow insights for an executive HR workspace
  background_color: "#0b0b0b"
features:
  bot_user:
    display_name: People Pulse Read-Only
    always_online: false
oauth_config:
  scopes:
    bot:
      - channels:history
      - channels:read
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: true

# Deliberately absent: chat:write, groups:history, im:history, mpim:history,
# files:read, users:read.email, and all write scopes. Installing or changing a
# Slack app remains an explicit external approval gate.
